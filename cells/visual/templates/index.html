<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgencyOS | Cockpit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'mono': ['"JetBrains Mono"', 'monospace'],
                        'sans': ['"Inter"', 'sans-serif'],
                    },
                    colors: {
                        bg: '#09090b',         // Zinc 950
                        panel: '#18181b',      // Zinc 900
                        border: '#27272a',     // Zinc 800
                        text: '#e4e4e7',       // Zinc 200
                        muted: '#a1a1aa',      // Zinc 400
                        accent: '#10b981',     // Emerald 500
                        error: '#ef4444'       // Red 500
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #09090b;
            color: #e4e4e7;
            font-family: 'Inter', sans-serif;
        }

        .panel {
            background-color: #18181b;
            border: 1px solid #27272a;
            border-radius: 0.5rem;
        }

        /* Custom Scrollbar for Logs */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #18181b;
        }

        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }

        .pulse-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
    </style>
</head>

<body class="h-screen flex flex-col p-6 overflow-hidden">

    <!-- Header -->
    <header class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                <div class="w-3 h-3 bg-accent rounded-sm"></div>
                AgencyOS <span class="text-muted font-normal text-sm ml-2">v0.7</span>
            </h1>
        </div>

        <!-- Status Pills -->
        <div class="flex gap-3">
            <div id="hand-pill" class="panel px-3 py-1.5 text-xs font-mono flex items-center text-muted">
                <span class="pulse-dot bg-zinc-600"></span> HAND: IDLE
            </div>
            <div id="eye-pill" class="panel px-3 py-1.5 text-xs font-mono flex items-center text-muted">
                <span class="pulse-dot bg-zinc-600"></span> EYE: IDLE
            </div>
            <div id="mind-pill"
                class="panel px-3 py-1.5 text-xs font-mono flex items-center text-sky-400 border-sky-900/50 bg-sky-950/30">
                <span class="pulse-dot bg-sky-400 animate-pulse"></span> MIND: ONLINE
            </div>
            <div id="heart-pill" class="panel px-3 py-1.5 text-xs font-mono flex items-center text-muted">
                <span class="pulse-dot bg-zinc-600"></span> HEART: IDLE
            </div>
            <div id="voice-pill"
                class="panel px-3 py-1.5 text-xs font-mono flex items-center text-purple-900/50 border-purple-900/30">
                <span class="pulse-dot bg-purple-600"></span> VOICE: IDLE
            </div>
        </div>
    </header>

    <!-- Main Grid -->
    <main class="grid grid-cols-12 gap-6 flex-1 overflow-hidden min-h-0">

        <!-- Center: Action Stream -->
        <div class="col-span-8 panel flex flex-col overflow-hidden">
            <div class="p-3 border-b border-border bg-zinc-900/50 flex justify-between items-center">
                <h2 class="text-xs font-mono font-medium text-muted uppercase tracking-wider">Communication Stream</h2>
                <div class="text-[10px] text-zinc-600 font-mono">LIVE</div>
            </div>

            <div id="log-container" class="flex-1 overflow-y-auto p-4 space-y-3 font-mono text-sm leading-relaxed">
                <!-- Logs rendered here -->
                <div class="text-zinc-500 italic">System ready to help.</div>
            </div>
        </div>

        <!-- Right: Visual Context -->
        <div class="col-span-4 flex flex-col gap-6">

            <!-- Vision Feed -->
            <div class="panel flex-1 flex flex-col overflow-hidden">
                <div class="p-3 border-border border-b bg-zinc-900/50">
                    <h2 class="text-xs font-mono font-medium text-muted uppercase tracking-wider">Visual Context</h2>
                </div>
                <!-- FORCE BACKGROUND TO BLACK and use Flex -->
                <div class="flex-1 bg-black relative flex items-center justify-center p-4 min-h-[200px]">
                    <img id="eye-feed" src="" class="max-w-full max-h-full object-contain hidden"
                        style="display: none;">

                    <!-- Empty State -->
                    <div id="eye-placeholder" class="text-center w-full">
                        <div
                            class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-zinc-900 border border-zinc-800 mb-3">
                            <!-- Simple Eye Icon SVG -->
                            <svg class="w-5 h-5 text-zinc-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </div>
                        <div class="text-xs text-zinc-500 font-mono">No visual signal</div>
                    </div>
                </div>
            </div>

            <!-- Quick Stats -->
            <div class="panel h-1/3 p-4">
                <h2 class="text-xs font-mono font-medium text-muted uppercase tracking-wider mb-4">System Health</h2>
                <div class="space-y-2">
                    <div class="flex justify-between text-xs">
                        <span class="text-zinc-500">Hand (Port 8000)</span>
                        <span class="text-emerald-500">Connected</span>
                    </div>
                    <div class="flex justify-between text-xs">
                        <span class="text-zinc-500">Eye (Port 8084)</span>
                        <span class="text-emerald-500">Connected</span>
                    </div>
                </div>
            </div>

            <!-- Hive Panel -->
            <div class="panel p-4 flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xs font-mono font-medium text-muted uppercase tracking-wider">The Hive</h2>
                    <span id="hive-count" class="text-[10px] bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded-full">0
                        Active</span>
                </div>

                <div id="hive-feed" class="flex-1 overflow-y-auto space-y-2">
                    <!-- Hive Agents Rendered Here -->
                    <div class="text-[10px] text-zinc-600 font-mono text-center pt-4">No active background agents</div>
                </div>
            </div>

        </div>

    </main>

    <!-- Input Area -->
    <footer class="mt-6">
        <div class="panel p-2 flex items-center gap-3 transition-colors focus-within:border-accent">
            <div class="pl-3 text-accent transition-opacity duration-300" id="input-indicator">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </div>
            <input id="command-input" type="text" placeholder="Type a message to the Agent..."
                class="bg-transparent flex-1 py-3 text-sm font-mono text-white placeholder-zinc-500 focus:outline-none">
            <button id="send-btn"
                class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-medium rounded transition-colors uppercase tracking-wide">
                Send
            </button>
        </div>
    </footer>

    <script>
        console.log("Dashboard Script Loaded");

        var ws = new WebSocket("ws://" + window.location.host + "/ws");
        var logContainer = document.getElementById("log-container");
        var eyeFeed = document.getElementById("eye-feed");
        var eyePlaceholder = document.getElementById("eye-placeholder");
        var commandInput = document.getElementById("command-input");
        var sendBtn = document.getElementById("send-btn");
        var handPill = document.getElementById("hand-pill");
        var eyePill = document.getElementById("eye-pill");

        function addLog(source, text) {
            console.log("Adding log:", source, text);
            var div = document.createElement("div");

            if (source === "User") {
                div.className = "flex gap-3 justify-end";
                // User Bubble
                var bubble = document.createElement("div");
                bubble.className = "bg-zinc-800 text-emerald-400 font-bold px-4 py-2 rounded-lg rounded-tr-none max-w-[80%] border border-zinc-700";
                bubble.textContent = text;
                div.appendChild(bubble);
            } else if (source === "System") {
                div.className = "flex gap-3 justify-start";
                // System Icon
                var iconDiv = document.createElement("div");
                iconDiv.className = "w-8 h-8 rounded bg-emerald-900/30 flex items-center justify-center shrink-0 border border-emerald-900/50";
                iconDiv.textContent = "🤖";
                div.appendChild(iconDiv);

                // Content
                var contentDiv = document.createElement("div");
                contentDiv.className = "space-y-1 max-w-[80%] pt-1";
                var textDiv = document.createElement("div");
                textDiv.className = "text-zinc-200"; // HIGH CONTRAST
                textDiv.textContent = text;
                contentDiv.appendChild(textDiv);
                div.appendChild(contentDiv);
            } else {
                // Raw log
                div.className = "pl-11 text-xs text-zinc-400 font-mono"; // Medium Contrast
                div.textContent = "> " + text;
            }

            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function sendCommand() {
            var query = commandInput.value.trim();
            if (query !== "") {
                console.log("Sending command:", query);
                // Optimistic UI update
                addLog("User", query);
                ws.send(JSON.stringify({ type: "command", query: query }));
                commandInput.value = "";
            }
        }

        commandInput.addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
                sendCommand();
            }
        });

        sendBtn.addEventListener("click", sendCommand);

        ws.onopen = function () {
            console.log("WS Open");
            addLog("System_Raw", "Connected to Visual Cortex.");
        }

        if (msg.type === "bus_event") {
            console.log("Bus Event:", msg);
            if (msg.channel === "voice") {
                var action = msg.data.action;
                var text = msg.data.text;

                if (action === "speak") {
                    updatePill(voicePill, "VOICE", "SPEAKING");
                    addLog("System", "🗣️ " + text);

                    // Auto-reset after rough duration estimate (or wait for stop)
                    // Assuming 150wpm -> 2.5 words/sec. 
                    var duration = Math.max(2000, (text.split(" ").length / 2.5) * 1000);

                    setTimeout(function () {
                        updatePill(voicePill, "VOICE", "IDLE");
                    }, duration);
                }
            }
        } else if (msg.type === "update") {
            var state = msg.data;

            // Clear logs for sync (MVP)
            // logContainer.innerHTML = ""; // DISABLED CLEARING to keep history 
            // Actually, dashboard.py sends ALL logs every update? 
            // If so, we must clear. If it sends incremental, we append.
            // Assuming it sends FULL state.logs based on previous code:
            logContainer.innerHTML = "";

            state.logs.forEach(function (log) {
                if (log.startsWith("🧠 User: ")) {
                    addLog("User", log.replace("🧠 User: ", ""));
                } else if (log.startsWith("✋ ")) {
                    var cleanLog = log.replace("✋ ", "");
                    // Differentiate "Thinking" vs "Working" if possible, but for now:
                    if (cleanLog.includes("Complete") || cleanLog.includes("Result")) {
                        addLog("System", cleanLog);
                    } else {
                        addLog("System_Raw", cleanLog);
                    }
                } else {
                    addLog("System_Raw", log);
                }
            });

            updatePill(handPill, "HAND", state.hand_status);
            updatePill(eyePill, "EYE", state.eye_status);

            if (state.compassion_status) {
                updatePill(heartPill, "HEART", state.compassion_status);
            }

            if (state.compassion) {
                document.getElementById("avg-suffering").innerText = state.compassion.avg_suffering;
                document.getElementById("total-analyzed").innerText = state.compassion.total_analyzed;
                document.getElementById("compassion-last-updated").innerText = "UPDATED: " + state.compassion.last_updated;

                var feed = document.getElementById("distress-feed");
                feed.innerHTML = "";

                state.compassion.distress_signals.forEach(function (signal) {
                    var item = document.createElement("div");
                    item.className = "bg-pink-950/20 border border-pink-900/30 p-2 rounded flex justify-between items-center group hover:bg-pink-950/30 transition-colors";

                    var left = document.createElement("div");
                    left.className = "flex-1 mr-2";
                    // Pain Type
                    var pain = document.createElement("div");
                    pain.className = "text-[10px] text-pink-400 font-mono uppercase tracking-wider mb-0.5";
                    pain.textContent = signal.pain;
                    left.appendChild(pain);
                    // Title
                    var title = document.createElement("div");
                    title.className = "text-xs text-pink-100 line-clamp-1";
                    title.textContent = signal.title;
                    left.appendChild(title);

                    var score = document.createElement("div");
                    score.className = "text-sm font-bold text-pink-500 font-mono bg-pink-950/50 px-2 py-1 rounded";
                    score.textContent = signal.score;

                    item.appendChild(left);
                    item.appendChild(score);
                    feed.appendChild(item);
                });
            }

            if (state.last_screenshot && state.last_screenshot.startsWith("data:image")) {
                eyeFeed.src = state.last_screenshot;
                eyeFeed.style.display = "block";
                eyePlaceholder.style.display = "none";
            }

            if (state.hive) {
                document.getElementById("hive-count").innerText = state.hive.active_count + " Active";
                var hiveFeed = document.getElementById("hive-feed");

                if (state.hive.agents.length > 0) {
                    hiveFeed.innerHTML = "";
                    state.hive.agents.forEach(function (agent) {
                        var div = document.createElement("div");
                        div.className = "p-2 bg-zinc-900 border border-zinc-800 rounded flex justify-between items-center";

                        var left = document.createElement("div");
                        var name = document.createElement("div");
                        name.className = "text-xs text-zinc-300 font-medium";
                        name.innerText = agent.id;
                        left.appendChild(name);

                        var pid = document.createElement("div");
                        pid.className = "text-[10px] text-zinc-600 font-mono";
                        pid.innerText = "PID: " + agent.pid;
                        left.appendChild(pid);

                        var status = document.createElement("div");
                        var isRunning = agent.status === "Running";
                        status.className = "text-[10px] font-mono px-1.5 py-0.5 rounded " + (isRunning ? "text-emerald-400 bg-emerald-950/30" : "text-red-400 bg-red-950/30");
                        status.innerText = agent.status.toUpperCase();

                        div.appendChild(left);
                        div.appendChild(status);
                        hiveFeed.appendChild(div);
                    });
                }
            }
        }
        };

        var heartPill = document.getElementById("heart-pill");
        var voicePill = document.getElementById("voice-pill");

        function updatePill(el, label, status) {
            var isBusy = (status === "Thinking" || status === "Working" || status === "Observing" || status === "Active" || status === "SPEAKING");
            var isError = status === "Error" || status.includes("Error") || status === "No Data";

            // Custom colors for Voice
            var isVoice = label === "VOICE";

            var colorClass;
            var dotClass;
            var borderClass;

            if (isVoice) {
                colorClass = isBusy ? "text-purple-400" : "text-zinc-400";
                dotClass = isBusy ? "bg-purple-400 animate-pulse" : "bg-zinc-600";
                borderClass = isBusy ? "border-purple-900/50 bg-purple-950/30" : "border-zinc-800 bg-zinc-900";
            } else {
                colorClass = isBusy ? (label === "HEART" ? "text-pink-400" : "text-emerald-400") : (isError ? "text-red-400" : "text-zinc-400");
                dotClass = isBusy ? (label === "HEART" ? "bg-pink-400 animate-pulse" : "bg-emerald-400 animate-pulse") : (isError ? "bg-red-400" : "bg-zinc-600");
                borderClass = isError ? "border-red-900/50 bg-red-950/30" : (isBusy ? (label === "HEART" ? "border-pink-900/50 bg-pink-950/30" : "border-emerald-900/50 bg-emerald-950/30") : "border-zinc-800 bg-zinc-900");
            }

            el.className = "panel px-3 py-1.5 text-xs font-mono flex items-center " + colorClass + " " + borderClass;
            el.innerHTML = '<span class="pulse-dot ' + dotClass + '"></span> ' + label + ': ' + status.toUpperCase();
        }
    </script>
</body>

</html>
