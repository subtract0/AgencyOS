[pytest]
pythonpath = .

# ============================================================================
# STATE-OF-THE-ART TEST MARKERS
# ============================================================================
markers =
    unit: marks tests as unit tests (fast, isolated, mocked externals, <2s)
    integration: marks tests as integration tests (component interactions, <10s)
    e2e: marks end-to-end tests (full system scenarios, <30s)
    smoke: marks critical path tests for rapid TDD feedback (<30s total suite)
    slow: marks slow tests that may take longer to run (>1s, needs optimization)
    stress: marks stress tests for performance and scalability validation (large data, high load)
    benchmark: marks benchmark performance tests (>1min allowed)
    experimental: marks tests for experimental features not yet implemented
    github: marks tests requiring GitHub API access
    asyncio: mark test as async (used by pytest-asyncio)
    timeout: marks tests with custom timeout (requires pytest-timeout)
    quarantine: marks flaky tests (runs but doesn't block CI, auto-applied by health tracking)
    no_retry: marks tests that should not auto-retry (critical infrastructure tests)
    serial: marks tests that must run serially (not parallel) to avoid race conditions
    network: marks tests that make real network connections (requires socket management)
    distributed: marks tests using distributed locks (may need serial execution)
    xdist_group: marks tests that should run in same xdist worker group (shared state isolation)
    necessary_normal: NECESSARY pattern - normal operation tests (happy path)
    necessary_edge: NECESSARY pattern - edge case tests (boundary conditions)
    necessary_corner: NECESSARY pattern - corner case tests (unusual combinations)
    necessary_error: NECESSARY pattern - error condition tests (failure scenarios)
    necessary_security: NECESSARY pattern - security tests (input validation, injection)
    necessary_stress: NECESSARY pattern - stress tests (performance under load)
    necessary_accessibility: NECESSARY pattern - accessibility tests (API usability)
    necessary_resilience: NECESSARY pattern - resilience tests (graceful handling)
    necessary_yield: NECESSARY pattern - yield tests (output validation)

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ignore property tests when hypothesis not installed
norecursedirs = tests/property

# ============================================================================
# DEFAULT BEHAVIOR: FAST TDD FEEDBACK LOOP
# ============================================================================
# By default, run only unit tests for <3 minute feedback cycle
# This is the state-of-the-art approach for Test-Driven Development
#
# Usage patterns:
#   pytest                  → Unit tests only (fast, <3 min)
#   pytest -m "unit"        → Explicit unit tests
#   pytest -m "integration" → Integration tests only
#   pytest -m "e2e"         → End-to-end tests only
#   pytest -m "smoke"       → Critical path smoke tests (<30s)
#   pytest -m "not slow"    → Skip slow tests needing optimization
#   pytest tests/           → ALL tests (full validation, 5-10 min)
#
# The default ensures developers get rapid feedback without waiting
# for slow integration/e2e tests during the TDD red-green-refactor cycle.
# pytest-xdist RE-ENABLED: Memory-aware parallelism (2.7x speedup)
# See docs/PYTEST_XDIST_ANALYSIS.md for validation testing
# pytest-rerunfailures REMOVED: Root cause of segfaults (ADR-030)
# IMPORTANT: Worker count (-n) controlled by run_tests.py memory-aware logic
# DO NOT hardcode -n or --dist here - let memory_aware_test_runner.py decide
addopts =
    -q
    --strict-markers
    --tb=short
    --color=yes

# ============================================================================
# PERFORMANCE OPTIMIZATION SETTINGS
# ============================================================================
# Parallel execution: Enabled with pytest-xdist (already installed)
# - Uses all CPU cores for 3x faster test execution
# - loadgroup distribution maintains test isolation
# Timeout enforcement: ENABLED - pytest-timeout 2.4.0 installed
# - Global timeout: 300s (5 min) per test (safety fallback)
# - Method: thread (safer for async tests, avoids signal conflicts with xdist)
# - conftest.py auto-applies tighter timeouts: unit=2s, integration=10s, e2e=30s
# Auto-categorization: conftest.py adds markers by directory
# Global mocking: conftest.py mocks OpenAI/Firestore in unit tests

asyncio_mode = auto

# ============================================================================
# WARNING FILTERS
# ============================================================================
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::ResourceWarning

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
# Harden pytest logging for cross-runner compatibility
# Route log file to .output/ directory (pristine codebase architecture)
log_file = .output/logs/pytest.log
log_file_level = WARNING
log_file_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Console logging (only show warnings/errors during test runs)
log_cli = false
log_cli_level = WARNING
