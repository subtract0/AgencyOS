name: CI - Constitutional Compliance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'
  USE_ENHANCED_MEMORY: 'true'
  USE_LOCAL_MODEL: 'false'  # Disable local model in CI
  PYTEST_TIMEOUT_MULTIPLIER: '3.0'

jobs:
  # Article I & II: Complete context and 100% verification
  test-suite:
    name: Test Suite (Article II - 100% Verification)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git-based tests

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout pytest-xdist python-dotenv

      - name: Run test suite (Article II - 100% pass required)
        run: |
          python run_tests.py --run-all --timeout-multiplier 3.0
        env:
          FORCE_RUN_ALL_TESTS: '1'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            logs/
            .pytest_cache/
          retention-days: 7

  # Article III: Code quality enforcement
  code-quality:
    name: Code Quality (Article III - Quality Gates)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy black isort

      - name: Run ruff (fast linter)
        run: |
          ruff check . --exit-zero --output-format=github

      - name: Run black (code formatter check)
        run: |
          black --check . --exclude '/(\.git|\.venv|\.pytest_cache|__pycache__|build|dist)/' || echo "Black formatting issues found (non-blocking)"

      - name: Run isort (import sorting check)
        run: |
          isort --check-only . --skip .venv --skip .pytest_cache || echo "Import sorting issues found (non-blocking)"

      - name: Type checking with mypy (strict mode)
        run: |
          mypy agency.py --ignore-missing-imports --no-error-summary || echo "Type checking issues found (non-blocking for now)"
        continue-on-error: true

  # Article IV: Constitutional compliance check
  constitutional-compliance:
    name: Constitutional Compliance (Articles I-V)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for Dict[Any, Any] violations (Constitutional)
        run: |
          echo "Checking for Dict[Any, Any] violations..."
          if grep -r "Dict\[Any, Any\]" --include="*.py" . --exclude-dir=".venv" --exclude-dir=".git"; then
            echo "❌ CONSTITUTIONAL VIOLATION: Dict[Any, Any] found (Article III)"
            echo "Use Pydantic models with typed fields instead"
            exit 1
          else
            echo "✅ No Dict[Any, Any] violations found"
          fi

      - name: Check ADR index is updated
        run: |
          echo "Verifying ADR-INDEX.md is up to date..."
          if [ -f "docs/adr/ADR-INDEX.md" ]; then
            echo "✅ ADR-INDEX.md exists"
          else
            echo "⚠️ ADR-INDEX.md missing"
          fi

      - name: Verify constitution.md exists
        run: |
          if [ -f "constitution.md" ]; then
            echo "✅ Constitution exists"
          else
            echo "❌ constitution.md missing!"
            exit 1
          fi

  # Summary job - Required for branch protection
  ci-summary:
    name: CI Summary (All Checks)
    runs-on: ubuntu-latest
    needs: [test-suite, code-quality, constitutional-compliance]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          echo "Test Suite: ${{ needs.test-suite.result }}"
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo "Constitutional Compliance: ${{ needs.constitutional-compliance.result }}"

          if [ "${{ needs.test-suite.result }}" != "success" ]; then
            echo "❌ Test suite failed - Article II violation (100% verification required)"
            exit 1
          fi

          if [ "${{ needs.constitutional-compliance.result }}" != "success" ]; then
            echo "❌ Constitutional compliance failed - Article III violation"
            exit 1
          fi

          echo "✅ All CI checks passed - Constitutional compliance achieved"
