  # Consolidation job - aggregates all test job results
  test-verification:
    name: "ADR-002 Test Verification"
    needs: [setup, test-orchestrator, test-tools-ci-monitor, test-tools-orchestrator, test-tools-core, test-integration-1, test-integration-2, test-integration-3a, test-integration-3b, test-integration-3c, test-unit, test-chaos, test-stress, test-misc-adr-agents, test-foundation-fast, test-foundation-commands, test-misc-meta-necessary-property, test-misc-shared-trinity]
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: write
      checks: write

    outputs:
      test-status: ${{ steps.test-summary.outputs.status }}
      test-summary: ${{ steps.test-summary.outputs.summary }}
      failure-count: ${{ steps.test-summary.outputs.failures }}

    steps:
      - name: "🔍 Checkout Repository"
        uses: actions/checkout@v4

      - name: "📦 Download Test Artifacts"
        if: always()
        uses: actions/download-artifact@v4
        with:
          path: all-test-results
          pattern: test-results-*
          merge-multiple: false

      - name: "📄 Collect Failure Reports"
        if: always()
        run: |
          set -o pipefail
          mkdir -p failure-reports
          for shard_dir in all-test-results/test-results-*/; do
            shard_name=$(basename "$shard_dir")
            report_md="$shard_dir/report.md"
            if [ -f "$report_md" ] && grep -q "❌" "$report_md"; then
              {
                echo "### ${shard_name}"
                cat "$report_md"
                echo ""
              } > "failure-reports/${shard_name}.md"
            fi
          done
          # Combine failure reports (if any)
          cat failure-reports/*.md > combined-failures.md 2>/dev/null || echo "✅ All shards passed" > combined-failures.md

      - name: "📊 Aggregate Test Results"
        id: test-summary
        run: |
          set -o pipefail
          echo "📊 Consolidating results from all test jobs..."

          # Check all job results (GitHub Actions context)
          echo "Job Results:"
          echo "  test-orchestrator: ${{ needs.test-orchestrator.result }}"
          echo "  test-tools-ci-monitor: ${{ needs.test-tools-ci-monitor.result }}"
          echo "  test-tools-orchestrator: ${{ needs.test-tools-orchestrator.result }}"
          echo "  test-tools-core: ${{ needs.test-tools-core.result }}"
          echo "  test-integration-1: ${{ needs.test-integration-1.result }}"
          echo "  test-integration-2: ${{ needs.test-integration-2.result }}"
          echo "  test-integration-3a: ${{ needs.test-integration-3a.result }}"
          echo "  test-integration-3b: ${{ needs.test-integration-3b.result }}"
          echo "  test-integration-3c: ${{ needs.test-integration-3c.result }}"
          echo "  test-unit: ${{ needs.test-unit.result }}"
          echo "  test-chaos: ${{ needs.test-chaos.result }}"
          echo "  test-stress: ${{ needs.test-stress.result }}"
          echo "  test-misc-adr-agents: ${{ needs.test-misc-adr-agents.result }}"
          echo "  test-foundation-fast: ${{ needs.test-foundation-fast.result }}"
          echo "  test-foundation-commands: ${{ needs.test-foundation-commands.result }}"
          echo "  test-foundation-gates: skipped (manual-only, see docs/ci/TOP_LEVEL_MANUAL_VERIFICATION.md)"
          echo "  test-misc-meta-necessary-property: ${{ needs.test-misc-meta-necessary-property.result }}"
          echo "  test-misc-shared-trinity: ${{ needs.test-misc-shared-trinity.result }}"
          echo "  top-level suites requested: ${{ github.event_name == 'workflow_dispatch' && inputs.run_top_level == 'true' }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.run_top_level }}" == "true" ]]; then
            echo "  top-level suites status: running via dedicated shards (manual trigger)"
          else
            echo "  top-level suites status: skipped (manual verification required, see docs/ci/TOP_LEVEL_MANUAL_VERIFICATION.md)"
          fi

          # Check if all jobs succeeded
          if [[ "${{ needs.test-orchestrator.result }}" == "success" ]] && \
             [[ "${{ needs.test-tools-ci-monitor.result }}" == "success" ]] && \
             [[ "${{ needs.test-tools-orchestrator.result }}" == "success" ]] && \
             [[ "${{ needs.test-tools-core.result }}" == "success" ]] && \
             [[ "${{ needs.test-integration-1.result }}" == "success" ]] && \
             [[ "${{ needs.test-integration-2.result }}" == "success" ]] && \
             [[ "${{ needs.test-integration-3a.result }}" == "success" ]] && \
             [[ "${{ needs.test-integration-3b.result }}" == "success" ]] && \
             [[ "${{ needs.test-integration-3c.result }}" == "success" ]] && \
             [[ "${{ needs.test-unit.result }}" == "success" ]] && \
             [[ "${{ needs.test-chaos.result }}" == "success" ]] && \
             [[ "${{ needs.test-stress.result }}" == "success" ]] && \
             [[ "${{ needs.test-misc-adr-agents.result }}" == "success" ]] && \
             [[ "${{ needs.test-foundation-fast.result }}" == "success" ]] && \
             [[ "${{ needs.test-foundation-commands.result }}" == "success" ]] && \
             [[ "${{ needs.test-misc-meta-necessary-property.result }}" == "success" ]] && \
             [[ "${{ needs.test-misc-shared-trinity.result }}" == "success" ]]; then
            echo "✅ ADR-002 COMPLIANT: All test jobs passed"
            echo "status=success" >> $GITHUB_OUTPUT
            echo "summary=✅ ADR-002 COMPLIANT: All tests passed (job isolation approach)" >> $GITHUB_OUTPUT
            echo "failures=0" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "❌ ADR-002 VIOLATION: One or more test jobs failed"
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "summary=❌ ADR-002 VIOLATION: Test failures detected" >> $GITHUB_OUTPUT
            echo "failures=1" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: "💬 Comment Test Results on PR"
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const testStatus = '${{ steps.test-summary.outputs.status }}';
            let commentBody = '';

            if (testStatus === 'success') {
              commentBody = `## 🎯 ADR-002 Compliance: ✅ APPROVED

            **Merge Guardian Status**: All systems green! 🚀

            ### Test Results Summary
            - **✅ All test jobs passed** (independent job isolation)
            - **Success Rate**: 100% ✨

            ### ADR-002 Verification
            ✅ **100% Test Success Rate Achieved**
            ✅ **No Broken Windows Policy Maintained**
            ✅ **Ready for Merge**

            ---
            *This PR meets all ADR-002 requirements and is approved for merge.*
            `;
            } else {
              // Read failure details if available
              const fs = require('fs');
              let failureDetails = '';
              try {
                failureDetails = fs.readFileSync('combined-failures.md', 'utf8');
              } catch (e) {
                failureDetails = '_(Failure details not available - check job logs)_';
              }

              commentBody = `## 🚫 ADR-002 Compliance: ❌ BLOCKED

            **Merge Guardian Status**: Merge blocked due to test failures! 🛑

            ### ⚠️ ADR-002 Violations Detected

            ❌ **One or more test jobs failed**

            ### 🔍 Failure Details

            ${failureDetails}

            ### Required Actions
            1. 🔧 **Fix all failing tests** - No exceptions
            2. 🧪 **Ensure 100% pass rate** - ADR-002 requirement
            3. ♻️ **Re-run tests** - Push new commits to trigger re-check
            4. ✅ **Verify compliance** - All tests must pass

            ### Branch Protection
            🚫 **This PR cannot be merged until all tests pass**
            🔒 **No bypass allowed** - ADR-002 is non-negotiable
            🏆 **"No Broken Windows"** - Quality is not optional

            ---
            *ADR-002 enforces 100% test success rate. Fix the issues above and push changes to re-trigger verification.*
            `;
            }

            // Post or update comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(comment =>
              comment.body.includes('ADR-002 Compliance:')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

  # Merge readiness assessment - only runs if tests pass
  merge-readiness:
    name: "🛡️ Merge Readiness Assessment"
    needs: test-verification
    runs-on: ubuntu-latest
    if: always()

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: "📋 Assess Merge Readiness"
        run: |
          set -o pipefail
          echo "🔍 Evaluating merge readiness against ADR-002..."

          TEST_STATUS="${{ needs.test-verification.outputs.test-status }}"
          FAILURE_COUNT="${{ needs.test-verification.outputs.failure-count }}"

          echo "📊 Assessment Results:"
          echo "  Test Status: $TEST_STATUS"
          echo "  Failed Tests: $FAILURE_COUNT"

          if [ "$TEST_STATUS" = "success" ] && [ "$FAILURE_COUNT" = "0" ]; then
            echo ""
            echo "✅ MERGE APPROVED"
            echo "🎯 ADR-002 requirements fully satisfied"
            echo "🚀 This PR is ready for merge"
            echo "🛡️ No Broken Windows policy maintained"

            # Create success summary
            cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🎯 ADR-002 Merge Guardian: APPROVED ✅

          ### Status: Ready for Merge 🚀

          **All ADR-002 requirements satisfied:**
          - ✅ 100% test success rate achieved
          - ✅ Zero test failures detected
          - ✅ No Broken Windows policy maintained
          - ✅ Quality standards upheld

          **Merge is approved and recommended.**
          EOF

          else
            echo ""
            echo "❌ MERGE BLOCKED"
            echo "🚫 ADR-002 requirements NOT satisfied"
            echo "⚠️ Test failures must be resolved first"
            echo "🔧 Fix all issues before attempting merge"

            # Create failure summary
            cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🚫 ADR-002 Merge Guardian: BLOCKED ❌

          ### Status: Merge Not Permitted 🛑

          **ADR-002 violations detected:**
          - ❌ Test failures present ($FAILURE_COUNT failed)
          - ❌ 100% success rate requirement not met
          - ❌ No Broken Windows policy violated
          - ❌ Quality standards not satisfied

          **Required actions:**
          1. Fix all failing tests
          2. Achieve 100% test pass rate
          3. Re-run verification workflow
          4. Obtain ADR-002 compliance approval

          **Merge will remain blocked until all tests pass.**
          EOF

            # Fail the job to block merge
            exit 1
          fi

      - name: "📝 Create Merge Readiness Report"
        if: always()
        run: |
          set -o pipefail
          mkdir -p reports

          cat > reports/merge-readiness.md << EOF
          # ADR-002 Merge Readiness Report

          **Generated**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          **Workflow**: Merge Guardian - ADR-002 Enforcement
          **Commit**: ${{ github.sha }}
          **Branch**: ${{ github.head_ref || github.ref_name }}

          ## Assessment Summary

          **Test Status**: ${{ needs.test-verification.outputs.test-status }}
          **Failed Tests**: ${{ needs.test-verification.outputs.failure-count }}
          **Summary**: ${{ needs.test-verification.outputs.test-summary }}

          ## ADR-002 Compliance

          ADR-002 requires:
          - 100% test success rate (0 failures)
          - "No Broken Windows" policy enforcement
          - Comprehensive test verification before merge

          ## Branch Protection Requirements

          To enforce ADR-002, configure branch protection rules:

          1. **Require status checks**:
             - \`ADR-002 Test Verification\`
             - \`Merge Readiness Assessment\`

          2. **Require branches to be up to date**: ✅

          3. **Restrict pushes**:
             - Require pull request reviews
             - No bypass for administrators

          4. **Required checks must pass**: ✅

          ## Recommendation

          ${{ needs.test-verification.outputs.test-status == 'success' && needs.test-verification.outputs.failure-count == '0' && '✅ **APPROVE MERGE** - All ADR-002 requirements satisfied' || '❌ **BLOCK MERGE** - ADR-002 violations must be resolved first' }}
          EOF

          echo "📋 Merge readiness report generated"

      - name: "📎 Upload Merge Readiness Report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-readiness-report-${{ github.sha }}
          path: reports/
          retention-days: 90

# Branch Protection Configuration (to be applied in repository settings):
#
# This workflow enforces ADR-002 through the following mechanisms:
#
# 1. Required Status Checks:
#    - "ADR-002 Test Verification" job must pass
#    - "Merge Readiness Assessment" job must pass
#    - Both jobs will fail if any tests fail
#
# 2. No Bypass Policy:
#    - Even administrators cannot bypass these checks
#    - Enforces "No Broken Windows" at the repository level
#
# 3. Automatic Blocking:
#    - Any test failure immediately blocks merge
#    - Clear feedback provided on PR with remediation steps
#    - Detailed artifacts generated for debugging
#
# 4. Comprehensive Reporting:
#    - Test results posted as PR comments
#    - Detailed artifacts with test outputs
#    - Merge readiness assessments
#
# To configure branch protection:
# 1. Go to Settings > Branches
# 2. Add rule for 'main' branch
# 3. Enable "Require status checks to pass before merging"
# 4. Select required checks:
#    - "ADR-002 Test Verification"
#    - "Merge Readiness Assessment"
# 5. Enable "Require branches to be up to date before merging"
# 6. Enable "Restrict pushes that create files"
# 7. DO NOT enable "Allow administrators to bypass"
#
# This ensures 100% ADR-002 compliance with zero exceptions.
