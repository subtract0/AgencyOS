name: "Merge Guardian - ADR-002 Enforcement"

# This workflow enforces ADR-002: "100% Verifikation und Stabilität"
# - All tests must pass with 0 failures before merge
# - Implements "No Broken Windows" policy
# - Provides comprehensive test verification and reporting

on:
  # Trigger on all pull request events
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

  # Trigger on pushes to main branch (for verification)
  push:
    branches: [main]

  # Allow manual workflow execution
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual execution'
        required: false
        default: 'Manual ADR-002 verification'
      run_top_level:
        description: 'Run expensive top-level suites (core + leap)'
        required: false
        default: 'false'

env:
  # Enforce strict CI environment
  CI: true
  PYTHONPATH: ${{ github.workspace }}
  # Article IV: VectorStore integration mandatory (constitutional mandate)
  USE_ENHANCED_MEMORY: true
  # OpenEnv-style spec integration (Phase 2)
  AGENCY_ENV_SPEC: ${{ github.workspace }}/envs/agency_env_spec.json

jobs:
  # Shared setup job - prepares Python environment (reused by all test jobs via cache)
  setup:
    name: "🔧 Environment Setup"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      python-version: "3.13"
      cache-key: ${{ steps.cache-info.outputs.key }}

    steps:
      - name: "🔍 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python 3.13"
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: "⚙️ Install Dependencies"
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install git+https://github.com/openai/openai-agents-python.git@main
          python -m pip install pytest-timeout pytest-json-report

      - name: "📋 Output Cache Info"
        id: cache-info
        run: echo "key=${{ runner.os }}-pip-python3.13-${{ hashFiles('requirements.txt') }}" >> $GITHUB_OUTPUT

  # Independent test jobs - each gets fresh Python process (solves OOM issue)
  test-orchestrator:
    name: "🧪 Tests: orchestrator suite"
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install git+https://github.com/openai/openai-agents-python.git@main
          python -m pip install pytest-timeout pytest-json-report
      - name: "🔄 Initialize environment via spec runner"
        run: |
          set -o pipefail
          mkdir -p test-results
          export AGENCY_ENV_SPEC=${{ github.workspace }}/envs/agency_env_spec.json
          python envs/agency_env_runner.py reset > test-results/runner-reset.log 2>&1
          echo "✅ Environment reset complete"
      - name: "Run orchestrator tests"
        run: |
          set -o pipefail
          export PYTHONPATH=${{ github.workspace }}
          export USE_ENHANCED_MEMORY=true
          export AGENCY_TEST_TIMEOUT_OVERRIDE=300
          export AGENCY_ENV_SPEC=${{ github.workspace }}/envs/agency_env_spec.json
          mkdir -p test-results
          python scripts/run_in_env.py \
            --timeout 900 \
            --log-file test-results/runner-step.json \
            --env PYTHONMALLOC=malloc \
            -- pytest tests/orchestrator \
              --ignore=tests/test_firestore_learning_persistence.py \
              --ignore=tests/test_firestore_mock_integration.py \
              --ignore=tests/e2e \
              --ignore=tests/benchmarks \
              -m "not slow" --ff --maxfail=1 -q \
              --json-report --json-report-file=test-results/report.json
      - name: "Generate test report"
        if: always()
        run: |
          set -o pipefail
          python .github/scripts/generate_test_report.py test-results/report.json > test-results/report.md || echo "⚠️ Report generation skipped"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-orchestrator
          path: test-results/
          retention-days: 7

