name: Auto-Quarantine Flaky Tests

# Mars Rover Bulletproofing: Automatically quarantine flaky tests
# Runs daily and after main branch updates

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  push:
    branches: [main]
  workflow_dispatch:  # Manual trigger

env:
  PYTHON_VERSION: '3.12'

jobs:
  check-and-quarantine:
    name: Check for Flaky Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check for quarantine candidates
        id: check
        run: |
          python tools/test_quarantine.py --check

          # Count candidates (remove newlines from grep output)
          CANDIDATE_COUNT=$(python tools/test_quarantine.py --check 2>&1 | grep -c "•" || echo "0")
          CANDIDATE_COUNT=$(echo "$CANDIDATE_COUNT" | tr -d '\n')
          echo "candidate_count=$CANDIDATE_COUNT" >> $GITHUB_OUTPUT

          if [ "$CANDIDATE_COUNT" -gt 0 ]; then
            echo "has_candidates=true" >> $GITHUB_OUTPUT
          else
            echo "has_candidates=false" >> $GITHUB_OUTPUT
          fi

      - name: Apply quarantine markers
        if: steps.check.outputs.has_candidates == 'true'
        run: |
          # Apply quarantine markers
          python tools/test_quarantine.py --apply

      - name: Create quarantine PR
        if: steps.check.outputs.has_candidates == 'true'
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create branch
          BRANCH_NAME="auto-quarantine-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"

          # Commit quarantine changes
          git add tests/ .test-health/
          git commit -m "chore: Auto-quarantine flaky tests

          Automatically detected and quarantined ${{ steps.check.outputs.candidate_count }} flaky tests.

          Quarantined tests:
          - Still run in CI (monitoring for stability)
          - Don't block merges (marked as xfail)
          - Will auto-remove after 1 week of stability

          🤖 Generated by Auto-Quarantine workflow"

          # Push branch
          git push origin "$BRANCH_NAME"

          # Create PR
          gh pr create \
            --title "chore: Auto-quarantine ${{ steps.check.outputs.candidate_count }} flaky tests" \
            --body "## 🔒 Automated Quarantine

          This PR automatically quarantines flaky tests detected by health tracking.

          **Quarantined Tests**: ${{ steps.check.outputs.candidate_count }}

          ### What This Does

          Quarantined tests:
          - ✅ Still run in CI (monitoring)
          - ⚠️  Marked as \`xfail\` (don't block merges)
          - 📊 Health tracking continues
          - ♻️  Auto-remove after 1 week of stability

          ### Why Quarantine?

          These tests have failed 3+ times in the past week or were marked as flaky
          by health tracking (40-95% pass rate). Quarantine prevents them from
          blocking development while investigation happens.

          ### Review Checklist

          - [ ] Verify quarantined tests are truly flaky
          - [ ] Check if tests need fixing vs environment issues
          - [ ] Approve to merge (tests won't block CI anymore)

          ---

          🤖 Generated by Auto-Quarantine workflow" \
            --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## 🔒 Quarantine Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check.outputs.has_candidates }}" = "true" ]; then
            echo "- Flaky tests found: ${{ steps.check.outputs.candidate_count }}" >> $GITHUB_STEP_SUMMARY
            echo "- Action: Created PR with quarantine markers" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No flaky tests detected - system healthy" >> $GITHUB_STEP_SUMMARY
          fi
